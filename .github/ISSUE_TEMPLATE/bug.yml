name: Bug Report
description: Report an issue or unexpected behavior in mswap
title: "fix: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste tokens, credential blobs, or `client.json`. `mswap doctor` and `mswap debug record` output is safe to share.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what should have happened instead.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What commands or sequence caused the issue?
      placeholder: |
        1. Run `mswap switch 2`
        2. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: mswap --version output
      description: Output of `mswap --version`
      placeholder: "mswap 0.1.0 · not affiliated with Google"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you running mswap on?
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: mswap doctor --json output
      description: Paste the output of `mswap doctor --json` (or `mswap debug record`).
      render: json
    validations:
      required: false
