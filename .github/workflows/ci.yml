name: ci
on: { push: { branches: [main] }, pull_request: {} }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run python scripts/check_fixtures.py
      - run: uv run python scripts/check_layers.py
      - run: uv run python scripts/check_privacy.py
      - run: uv run python scripts/check_links.py
      - run: bash -n scripts/spikes/*.sh
  test:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.repository.private && '[{"os":"windows-latest","python":"3.14"},{"os":"ubuntu-latest","python":"3.11"}]' || '[{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"},{"os":"windows-latest","python":"3.14"},{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"},{"os":"macos-latest","python":"3.14"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: uv sync --all-groups
      - run: uv run pytest -q
  contract:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
      - run: uv sync --all-groups
      - if: runner.os == 'Windows'
        run: uv run pytest tests/contract -q -m "not live"
      - if: runner.os == 'macOS'
        run: uv run pytest tests/contract -q -m "not live"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
          dbus-run-session -- bash -c 'echo -n mswaptest | gnome-keyring-daemon --unlock --components=secrets && uv run pytest tests/contract -q'
  build:
    needs: [test, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv build
      - run: uv run --with dist/*.whl --no-project python -m mswap --version
