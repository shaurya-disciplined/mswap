name: post-release

on:
  release:
    types: [published]

concurrency:
  group: "post-release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Verify published package from PyPI
        shell: bash
        env:
          # Passed through the environment, never interpolated into the script: a tag name is
          # attacker-shaped text as far as the shell is concerned.
          TAG: ${{ github.event.release.tag_name }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          VERSION="${TAG#v}"
          echo "Verifying mswap $VERSION installation from PyPI on $RUNNER_LABEL..."
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5 (waiting for PyPI propagation)..."
            if uvx --from "mswap==$VERSION" python -m mswap --version; then
              echo "mswap==$VERSION successfully verified!"
              success=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Waiting 60 seconds before next attempt..."
              sleep 60
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Failed to install and verify mswap==$VERSION after 5 attempts"
            exit 1
          fi
