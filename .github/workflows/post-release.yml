name: post-release

# release.yml calls this after it publishes a Release: a Release created with GITHUB_TOKEN never
# fires the `release` event for other workflows. The `release` trigger covers Releases published
# by hand, and workflow_dispatch re-checks any tag on demand.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, e.g. v1.0.1"
        type: string
        required: true

concurrency:
  group: "post-release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Verify the release installs from its tag
        shell: bash
        env:
          # Passed through the environment, never interpolated into the script: a tag name is
          # attacker-shaped text as far as the shell is concerned.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          # Same source the installers use: uv installs mswap straight from the release tag.
          echo "Verifying mswap $TAG installs from GitHub on $RUNNER_LABEL..."
          out=$(uvx --from "git+https://github.com/$REPO@$TAG" mswap --version)
          echo "$out"
          case "$out" in
            *"${TAG#v}"*) echo "mswap $TAG verified." ;;
            *) echo "Installed version does not match $TAG"; exit 1 ;;
          esac
