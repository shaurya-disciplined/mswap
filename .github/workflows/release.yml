name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(uv run python -c "import mswap; print(mswap.__version__)")
          echo "Tag: $TAG, Package Version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: Tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG has section for version
        run: |
          VERSION=$(uv run python -c "import mswap; print(mswap.__version__)")
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing '## [$VERSION]' section"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')"
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish-testpypi, publish-pypi]
    if: always() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: |
          python3 -c '
          import re
          tag = "${{ github.ref_name }}"
          ver = tag.lstrip("v")
          content = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if match else ""
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          '

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=""
          if echo "$TAG" | grep -qE "a|b|rc"; then
            FLAGS="--prerelease"
          fi
          gh release create "$TAG" dist/* --notes-file RELEASE_NOTES.md --title "$TAG" $FLAGS
