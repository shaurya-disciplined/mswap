name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(uv run python -c "import mswap; print(mswap.__version__)")
          echo "Tag: $TAG, Package Version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: Tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG has section for version
        run: |
          VERSION=$(uv run python -c "import mswap; print(mswap.__version__)")
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing '## [$VERSION]' section"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI publishing is opt-in: set the repository variable PUBLISH_TO_PYPI=true once the
    # trusted publisher exists on (Test)PyPI. Until then these jobs are skipped and the GitHub
    # Release below is the only distribution channel (the installers install from its tag).
    if: vars.PUBLISH_TO_PYPI == 'true' && (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc'))
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: "vars.PUBLISH_TO_PYPI == 'true' && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')"
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, publish-testpypi, publish-pypi]
    if: always() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os
          import re
          tag = os.environ["TAG"]
          ver = tag.lstrip("v")
          content = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
          notes = match.group(1).strip() if match else ""
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          '

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=""
          if echo "$TAG" | grep -qE "a|b|rc"; then
            FLAGS="--prerelease"
          fi
          gh release create "$TAG" dist/* --notes-file RELEASE_NOTES.md --title "$TAG" $FLAGS

  # Install the published tag from GitHub on every OS, the way the installers do.
  smoke:
    needs: github-release
    permissions:
      contents: read
    uses: ./.github/workflows/post-release.yml
    with:
      tag: ${{ github.ref_name }}
