[project]
name = "mswap"
dynamic = ["version"]
description = "Multi-account switcher, usage dashboard and autopilot for Google's Antigravity CLI (agy)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []                      # ← must stay empty. Enforced by a test.
authors = [{ name = "Meteor (shaurya-disciplined)" }]
keywords = ["antigravity", "agy", "account-switcher", "cli", "gemini"]
classifiers = ["Environment :: Console", "Operating System :: Microsoft :: Windows",
               "Operating System :: MacOS", "Operating System :: POSIX :: Linux",
               "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
[project.optional-dependencies]
export = ["cryptography>=43"]          # W6 only: encrypted export/import
[project.scripts]
mswap = "mswap.cli:main"
[project.urls]
Homepage = "https://github.com/shaurya-disciplined/mswap"
Issues = "https://github.com/shaurya-disciplined/mswap/issues"
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.version]
path = "src/mswap/__init__.py"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","RUF","S","PTH","RET","ARG","TID"]
ignore = ["S101"]                      # asserts allowed in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","ARG"]
[tool.mypy]
strict = true
files = ["src"]
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mswap --cov-report=term-missing"
markers = ["live: needs MSWAP_LIVE_TESTS=1 and a human", "windows: Windows only", "posix: macOS/Linux only"]
